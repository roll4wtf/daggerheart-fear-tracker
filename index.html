<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Daggerheart Fear Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    body {
      width: 800px;
      min-height: 230px;
    }

    /* Sichtbare Leiste für OBS */
    .tracker {
      width: 800px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    #wolves {
      width: 780px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      align-items: center;
      gap: 8px;
    }

    .wolf {
      width: 56px;
      height: 56px;
      object-fit: contain;
      justify-self: center;
      opacity: 0.15;
      filter: grayscale(1) brightness(0.45);
      transform: scale(0.94);
      transition: 200ms ease;
    }

    .wolf.active {
      opacity: 1;
      filter:
        grayscale(0)
        brightness(1.08)
        drop-shadow(0 0 6px rgba(90, 190, 255, 0.95));
      transform: scale(1);
    }

    .wolf.newest {
      animation: pulse 450ms ease-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.7);
        filter:
          brightness(1.7)
          drop-shadow(0 0 15px rgba(120, 220, 255, 1));
      }

      60% {
        transform: scale(1.16);
      }

      100% {
        transform: scale(1);
      }
    }

    /* Bedienfeld */
    .controls {
      width: 800px;
      height: 155px;
      padding: 18px;
      background: #151922;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    button {
      min-width: 100px;
      height: 50px;
      border: 1px solid #72c9ff;
      border-radius: 8px;
      background: #284c67;
      color: white;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #397397;
    }

    button:active {
      transform: scale(0.96);
    }

    #fearValue {
      width: 100px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    #resetButton {
      width: 180px;
      height: 40px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <section class="tracker">
    <div id="wolves"></div>
  </section>

  <section class="controls">
    <div class="control-row">
      <button id="minusButton" type="button">−</button>
      <div id="fearValue">0 / 12</div>
      <button id="plusButton" type="button">+</button>
    </div>

    <button id="resetButton" type="button">
      Zurücksetzen
    </button>
  </section>

  <script>
    const MAX_FEAR = 12;
    const STORAGE_KEY = "daggerheart-fear-value";

    let fear = Number(localStorage.getItem(STORAGE_KEY));

    if (!Number.isFinite(fear)) {
      fear = 0;
    }

    fear = Math.max(0, Math.min(MAX_FEAR, fear));

    let previousFear = fear;

    function renderFear() {
      const container = document.getElementById("wolves");
      const valueDisplay = document.getElementById("fearValue");

      container.innerHTML = "";

      for (let position = 1; position <= MAX_FEAR; position += 1) {
        const wolf = document.createElement("img");

        wolf.src = "wolf.png";
        wolf.alt = "";
        wolf.className = "wolf";

        if (position <= fear) {
          wolf.classList.add("active");
        }

        if (fear > previousFear && position === fear) {
          wolf.classList.add("newest");
        }

        container.appendChild(wolf);
      }

      valueDisplay.textContent = fear + " / " + MAX_FEAR;
      localStorage.setItem(STORAGE_KEY, String(fear));
      previousFear = fear;
    }

    document
      .getElementById("plusButton")
      .addEventListener("click", function () {
        if (fear < MAX_FEAR) {
          fear += 1;
          renderFear();
        }
      });

    document
      .getElementById("minusButton")
      .addEventListener("click", function () {
        if (fear > 0) {
          fear -= 1;
          renderFear();
        }
      });

    document
      .getElementById("resetButton")
      .addEventListener("click", function () {
        fear = 0;
        renderFear();
      });

    renderFear();
  </script>
</body>
</html>
